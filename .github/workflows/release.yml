name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: card tree
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    outputs:
      zip: ${{ steps.package.outputs.zip }}
    steps:
      - uses: actions/checkout@v7

      - name: Install zip, cmake, jq, Task and Bun
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip unzip cmake jq
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin
          curl -fsSL https://bun.sh/install | BUN_INSTALL=/usr/local bash -s "bun-v1.2.6"

      - name: Build the tree
        run: task dist:device OUT="slot-${GITHUB_REF_NAME}"

      # pvaibhav ships the cheats beside the card; ours carries them, so a game has them at once.
      # A release of his may leave the pack out as unchanged, so it comes from the newest that has
      # one. Without them the card still works, so a missing pack only warns.
      - name: Add pvaibhav's cheat pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          pack="slot-${GITHUB_REF_NAME}/Cheats/Cheats.pack"
          url="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/pvaibhav/slot/releases \
            | jq -r '[.[] | select(.draft | not) | .assets[] | select(.name == "Cheats.pack")][0].browser_download_url // empty')"
          { test -n "$url" && curl -fsSL -o "$pack" "$url" && test -s "$pack"; } \
            || { rm -f "$pack"; echo "::warning::No Cheats.pack in pvaibhav's releases; the card ships without cheats"; }

      - name: Check what is about to ship
        run: sh tools/check-card-tree.sh "slot-${GITHUB_REF_NAME}"

      - name: Package
        id: package
        run: |
          set -eu
          out="slot-${GITHUB_REF_NAME}"
          zip="$out-h700.zip"
          zip -qry "$zip" "$out"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  publish:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.zip }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: |
          set -eu
          test "$(head -n 1 RELEASE_NOTES.md)" = "# ${GITHUB_REF_NAME}"
          tail -n +3 RELEASE_NOTES.md > notes.md
          # A tag moved onto a newer build keeps its release, which takes the new card and notes.
          # Deleting the tag to move it turns the release into a draft, so it is published again.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md \
              --draft=false
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi

      # Labels without Wi-Fi: pvaibhav's artwork pack, too big for the card's zip, goes beside it,
      # from the newest of his releases that has one. Without it the card still works.
      - name: Attach pvaibhav's artwork pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          url="$(gh api repos/pvaibhav/slot/releases \
            --jq '[.[] | select(.draft | not) | .assets[] | select(.name == "Artwork.pack")][0].browser_download_url // empty')"
          { test -n "$url" && curl -fsSL -o Artwork.pack "$url" && test -s Artwork.pack \
            && gh release upload "$GITHUB_REF_NAME" Artwork.pack --repo "$GITHUB_REPOSITORY" --clobber; } \
            || echo "::warning::No Artwork.pack in pvaibhav's releases; the release goes without it"

      # The fork's devices read versions.json from the latest release, not from the site.
      - name: Attach versions.json for the updater
        if: github.repository != 'BrandonKowalski/slot'
        env:
          GH_TOKEN: ${{ github.token }}
          SLOT_REPO: ${{ github.repository }}
          OUT: versions.json
        run: |
          set -eu
          bash .github/scripts/versions.sh
          test "$(jq -r .stable.tag versions.json)" = "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" versions.json --repo "$GITHUB_REPOSITORY"

      - name: Publish versions.json with the site
        if: github.repository == 'BrandonKowalski/slot'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
