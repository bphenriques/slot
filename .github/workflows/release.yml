name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: card tree
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    outputs:
      zip: ${{ steps.package.outputs.zip }}
    steps:
      - uses: actions/checkout@v7

      - name: Install zip, cmake and Task
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip cmake
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin

      - name: Build the tree
        run: task dist:device OUT="slot-${GITHUB_REF_NAME}"

      - name: Check what is about to ship
        run: |
          set -eu
          out="slot-${GITHUB_REF_NAME}"
          file "$out/System/slot" | grep -q aarch64
          file "$out/System/slot-services" | grep -q aarch64
          file "$out/System/slot-net/iw" | grep -q aarch64
          file "$out/System/muse/muse" | grep -q aarch64
          file "$out/System/muse/musectl" | grep -q aarch64
          test -f "$out/System/licenses/muse.meta"
          test -f "$out/Config/wifi.toml.example"
          test -f "$out/Config/retroachievements.toml.example"
          file "$out/System/mgba_libretro.so" | grep -q aarch64
          file "$out/System/gpsp_libretro.so" | grep -q aarch64
          test -x "$out/System/slot"
          gpsp_src_sha="$(cat vendor/gpsp-src.sha)"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.tar.gz"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.meta"
          for p in cores/gpsp/*.patch; do
            test -f "$out/System/licenses/gpsp-$(basename "$p")"
          done
          mgba_src_commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
          test -f "$out/System/licenses/mgba-${mgba_src_commit}.meta"
          for p in cores/mgba/*.patch; do
            test -f "$out/System/licenses/mgba-$(basename "$p")"
          done

      - name: Package
        id: package
        run: |
          set -eu
          out="slot-${GITHUB_REF_NAME}"
          zip="$out-h700.zip"
          zip -qry "$zip" "$out"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  publish:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.zip }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: |
          set -eu
          cat > notes.md <<NOTES
          Built on upstream slot 1.6.0 and its fixes since then. The last release of this fork was built on 1.4.0, so upstream's 1.5.0 and 1.6.0 changes are new here too. They are all in upstream's [changelog](https://github.com/BrandonKowalski/slot/blob/main/CHANGELOG.md). Highlights:

          - Settings are split into Screen and Gameplay pages.
          - Screen shaders per platform, and SELECT + B / A in game steps through them.
          - An optional 1 frame run-ahead for GBA games on mGBA, for lower input lag.
          - Large libraries boot faster, and resting on a cart reads its ROM ahead so games start sooner.
          - A red alarm shows when the SD card turns read-only or a save fails to write.
          - Backlight steps follow a curve, so the lowest setting goes dimmer.
          - Pokémon Pinball: Ruby & Sapphire rumble, and Game Boy cartridge clocks kept in the \`.sav\`.

          New in this fork:

          - HOME WI-FI is on the main quick menu page, between Gameplay and Date & Time.
          - The About sticker says it was seasoned in Berlin, and names Prashant Vaibhav beside the copyright.

          Everything else this fork adds (colour calibration, Home Wi-Fi, label downloads, RetroAchievements, linking over Wi-Fi, \`schedutil\`) carries over. See the [README](https://github.com/${GITHUB_REPOSITORY}#what-this-fork-adds).

          Unzip and copy the contents of \`slot-${GITHUB_REF_NAME}/\` onto SD2.

          Emulation by mGBA (MPL-2.0) and gpSP (GPL-2.0). Their licences, patches and gpSP's source are in \`System/licenses/\`.
          NOTES
          gh release create "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
