[package]
name = "slot-music-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The kit that draws a slot_music::Screen's parts. It knows neither the music nor the frontend:
# it makes faces and a draw list of its own for whatever host shows them.
[dependencies]
fontdue = { workspace = true }
resvg = { workspace = true }
usvg = { workspace = true }


[lints.clippy]
match_bool = "warn"
undocumented_unsafe_blocks = "warn"
