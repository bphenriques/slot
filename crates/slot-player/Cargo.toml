[package]
name = "slot-player"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
log.workspace = true
libc.workspace = true
libloading.workspace = true
lofty.workspace = true
rubato = "5"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "isomp4", "aac", "alac", "flac", "ogg", "vorbis", "wav", "pcm"] }
# Opus, which Symphonia reads in Ogg but cannot decode: libopus, built from its sources.
symphonia-adapter-libopus = "0.2.7"

[features]
# The writer's work in `Status`, timed by its thread's clock: for the performance log.
perf = []

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
cc = "1"

[lints.clippy]
match_bool = "warn"
undocumented_unsafe_blocks = "warn"
